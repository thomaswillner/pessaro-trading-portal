<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brand — Logo</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px 28px; background: var(--card); font-family: var(--font-sans); display: flex; gap: 18px; align-items: center; }
  .tile { flex: 1; border-radius: 12px; border: 1px solid var(--border); padding: 24px; display: flex; align-items: center; justify-content: center; min-height: 130px; }
  .light { background: linear-gradient(135deg, oklch(0.97 0.01 220), oklch(0.92 0.02 220)); }
  .dark { background: linear-gradient(135deg, oklch(0.16 0.06 250), oklch(0.20 0.10 280)); }
  .brand { background: linear-gradient(135deg, #061deb, #5e17eb); }
  .tile img { max-height: 80px; max-width: 100%; object-fit: contain; }
  .caption { position: absolute; bottom: 8px; left: 12px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted-foreground); }
  .wrap { position: relative; flex: 1; }
  .wrap .caption { color: var(--muted-foreground); }
  .wrap.on-dark .caption { color: oklch(0.85 0.01 0 / 0.70); }
</style>
</head>
<body>
  <div class="wrap"><div class="tile light"><img src="../assets/logo-pessaro.webp" alt="Pessaro Capital"></div><span class="caption">on light · institutional</span></div>
  <div class="wrap on-dark"><div class="tile dark"><img src="../assets/logo-pessaro.webp" alt="Pessaro Capital"></div><span class="caption">on dark · corporate futurism</span></div>
  <div class="wrap on-dark"><div class="tile brand"><img src="../assets/logo-pessaro.webp" alt="Pessaro Capital"></div><span class="caption">on brand · hero / favicon</span></div>
</body>
</html>
