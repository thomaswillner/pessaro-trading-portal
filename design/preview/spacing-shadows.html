<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spacing — Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 32px 28px; background: var(--background); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 24px; align-items: end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .box { width: 100%; aspect-ratio: 1.3 / 1; background: var(--card); border-radius: 14px; border: 1px solid var(--border); }
  .tok { font-family: var(--font-mono); font-size: 11px; color: var(--foreground); font-weight: 600; }
  .desc { font-size: 10px; color: var(--muted-foreground); }
</style>
</head>
<body>
<div class="grid">
  <div class="item"><div class="box" style="box-shadow: var(--shadow-sm);"></div><div class="tok">sm</div><div class="desc">at-rest cards</div></div>
  <div class="item"><div class="box" style="box-shadow: var(--shadow-md);"></div><div class="tok">md</div><div class="desc">buttons</div></div>
  <div class="item"><div class="box" style="box-shadow: var(--shadow-lg);"></div><div class="tok">lg</div><div class="desc">hover lift</div></div>
  <div class="item"><div class="box" style="box-shadow: var(--shadow-xl);"></div><div class="tok">xl</div><div class="desc">hero CTA</div></div>
  <div class="item"><div class="box" style="box-shadow: var(--shadow-accent-glow); border-color: oklch(0.45 0.25 280 / 0.40);"></div><div class="tok">accent-glow</div><div class="desc">primary CTA hover</div></div>
</div>
</body>
</html>
