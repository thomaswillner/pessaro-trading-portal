<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Type — Display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px 32px; background: var(--card); }
  .row { display: flex; align-items: baseline; gap: 24px; padding: 6px 0; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); width: 88px; flex-shrink: 0; letter-spacing: 0.04em; }
  .display { font-size: 56px; font-weight: 800; line-height: 1; letter-spacing: -0.025em; color: var(--foreground); }
  .h1 { font-size: 40px; font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; color: var(--foreground); }
  .h2 { font-size: 28px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; color: var(--foreground); }
  .body { font-size: 16px; font-weight: 400; line-height: 1.5; color: var(--foreground); }
  .accent { color: var(--accent); }
</style>
</head>
<body>
  <div class="row"><span class="meta">DISPLAY · 800</span><span class="display">Precisión <span class="accent">Institucional</span></span></div>
  <div class="row"><span class="meta">H1 · 700</span><span class="h1">Domine los Mercados</span></div>
  <div class="row"><span class="meta">H2 · 700</span><span class="h2">Servicios Financieros de Elite</span></div>
  <div class="row"><span class="meta">BODY · 400</span><span class="body">Plus Jakarta Sans · 400/500/600/700/800 · Spanish-optimized geometric sans</span></div>
</body>
</html>
