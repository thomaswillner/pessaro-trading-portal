<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Components — Instrument Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body { margin: 0; padding: 24px 28px; background: oklch(0.12 0.03 260); font-family: var(--font-sans); display: flex; gap: 16px; }
  .card { width: 280px; background: oklch(0.15 0.04 260 / 0.6); backdrop-filter: blur(12px); border: 1px solid oklch(0.20 0.04 260); border-radius: 14px; overflow: hidden; color: oklch(0.92 0.01 0); }
  .head { display: flex; align-items: center; justify-content: space-between; padding: 14px; border-bottom: 1px solid oklch(0.20 0.04 260 / 0.50); background: oklch(0.18 0.04 260 / 0.30); }
  .ticker { display: flex; align-items: center; gap: 10px; }
  .glyph { width: 36px; height: 36px; border-radius: 9999px; background: oklch(0.35 0.20 250 / 0.18); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-weight: 700; font-size: 12px; color: oklch(0.78 0.18 250); border: 1px solid oklch(0.35 0.20 250 / 0.30); }
  .sym { font-family: var(--font-mono); font-weight: 700; font-size: 14px; color: oklch(0.92 0.01 0); }
  .nm { font-size: 9px; text-transform: uppercase; letter-spacing: 0.04em; color: oklch(0.65 0.04 260); margin-top: 1px; }
  .badge { font-size: 10px; padding: 3px 8px; border-radius: 9999px; background: oklch(0.45 0.25 280); color: white; font-weight: 600; }
  .body { padding: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cell .k { font-size: 9px; text-transform: uppercase; letter-spacing: 0.05em; color: oklch(0.65 0.04 260); font-weight: 600; }
  .cell .v { font-family: var(--font-mono); font-weight: 700; font-size: 14px; color: oklch(0.92 0.01 0); margin-top: 4px; }
  .foot { display: flex; align-items: center; justify-content: space-between; padding: 0 14px 14px; }
  .delta { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-mono); font-size: 11px; font-weight: 500; padding: 4px 8px; border-radius: 6px; background: oklch(0.18 0.04 260); }
  .up { color: oklch(0.78 0.16 150); }
  .dn { color: oklch(0.72 0.20 25); }
  .delta [data-lucide] { width: 12px; height: 12px; }
  .btn-op { background: oklch(0.35 0.20 250); color: white; border: 0; height: 30px; padding: 0 16px; border-radius: 9999px; font-size: 11px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <div class="head"><div class="ticker"><div class="glyph">EU</div><div><div class="sym">EUR/USD</div><div class="nm">Euro vs Dólar</div></div></div><span class="badge">Forex</span></div>
    <div class="body">
      <div class="cell"><div class="k">Spread</div><div class="v">0.0 pips</div></div>
      <div class="cell"><div class="k">Apalancamiento</div><div class="v">1:500</div></div>
    </div>
    <div class="foot"><span class="delta up"><i data-lucide="trending-up"></i>+0.42%</span><button class="btn-op">Operar</button></div>
  </div>
  <div class="card">
    <div class="head"><div class="ticker"><div class="glyph">BT</div><div><div class="sym">BTC/USD</div><div class="nm">Bitcoin</div></div></div><span class="badge">Criptomonedas</span></div>
    <div class="body">
      <div class="cell"><div class="k">Spread</div><div class="v">50 pips</div></div>
      <div class="cell"><div class="k">Apalancamiento</div><div class="v">1:10</div></div>
    </div>
    <div class="foot"><span class="delta dn"><i data-lucide="trending-down"></i>−0.18%</span><button class="btn-op">Operar</button></div>
  </div>
<script>lucide.createIcons();</script>
</body>
</html>
