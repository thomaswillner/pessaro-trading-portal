<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Components — Form Inputs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body { margin: 0; padding: 24px 28px; background: var(--card); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 640px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .label { font-size: 13px; font-weight: 500; color: var(--foreground); }
  .input, .select { height: 40px; border: 1px solid var(--input); border-radius: 8px; background: var(--background); padding: 0 12px; font-size: 14px; font-family: var(--font-sans); color: var(--foreground); outline: none; }
  .input:focus, .select:focus { border-color: var(--ring); box-shadow: 0 0 0 3px oklch(0.45 0.25 280 / 0.18); }
  .input-icon { position: relative; }
  .input-icon [data-lucide] { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted-foreground); }
  .input-icon .input { padding-left: 38px; }
  .checkbox { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--foreground); }
  .check { width: 16px; height: 16px; border: 1px solid var(--input); border-radius: 4px; background: var(--background); position: relative; }
  .check.checked { background: var(--accent); border-color: var(--accent); }
  .check.checked::after { content: ""; position: absolute; left: 5px; top: 1px; width: 4px; height: 9px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }
</style>
</head>
<body>
<div class="grid">
  <div class="field"><label class="label">Correo electrónico</label><div class="input-icon"><i data-lucide="mail"></i><input class="input" placeholder="usted@ejemplo.com" value="francisco@pessaro.cl"></div></div>
  <div class="field"><label class="label">Teléfono</label><div class="input-icon"><i data-lucide="phone"></i><input class="input" placeholder="+56 9 ..." value="+56 9 22 07 15 11"></div></div>
  <div class="field"><label class="label">Depósito inicial (USD)</label><input class="input" style="font-family: var(--font-mono); font-weight: 500;" value="5,000.00"></div>
  <div class="field"><label class="label">Mercado preferido</label><select class="select"><option>Forex</option><option>Materias Primas</option><option>Criptomonedas</option></select></div>
  <div class="field" style="grid-column: 1/-1;"><label class="checkbox"><span class="check checked"></span> Acepto los Términos, Política de Privacidad y Advertencia de Riesgo.</label></div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
