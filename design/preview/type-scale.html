<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Type — Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px 32px; background: var(--card); }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 7px 0; vertical-align: baseline; }
  .tok { font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); width: 90px; letter-spacing: 0.04em; }
  .px  { font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); width: 56px; text-align: right; padding-right: 16px; }
  .spec { color: var(--foreground); font-weight: 500; letter-spacing: -0.01em; }
  .w  .spec { font-weight: 700; }
</style>
</head>
<body>
<table>
  <tr><td class="tok">fs-6xl</td><td class="px">60</td><td class="spec w" style="font-size:60px;line-height:1">Aa</td></tr>
  <tr><td class="tok">fs-5xl</td><td class="px">48</td><td class="spec w" style="font-size:48px;line-height:1">Mercados</td></tr>
  <tr><td class="tok">fs-4xl</td><td class="px">36</td><td class="spec w" style="font-size:36px;line-height:1.05">Precisión</td></tr>
  <tr><td class="tok">fs-3xl</td><td class="px">30</td><td class="spec" style="font-size:30px;line-height:1.1">Institucional</td></tr>
  <tr><td class="tok">fs-2xl</td><td class="px">24</td><td class="spec" style="font-size:24px;line-height:1.15">Servicios Financieros</td></tr>
  <tr><td class="tok">fs-xl</td><td class="px">20</td><td class="spec" style="font-size:20px;line-height:1.2">Acceda al mercado de divisas</td></tr>
  <tr><td class="tok">fs-lg</td><td class="px">18</td><td class="spec" style="font-size:18px;line-height:1.3">Tecnología de baja latencia</td></tr>
  <tr><td class="tok">fs-base</td><td class="px">16</td><td class="spec" style="font-size:16px;line-height:1.5">Spreads desde 0.0 pips en EUR/USD</td></tr>
  <tr><td class="tok">fs-sm</td><td class="px">14</td><td class="spec" style="font-size:14px;color:var(--muted-foreground)">UI · botones · labels</td></tr>
  <tr><td class="tok">fs-xs</td><td class="px">12</td><td class="spec" style="font-size:12px;letter-spacing:0.04em;text-transform:uppercase;color:var(--muted-foreground)">CAPTION · LEGAL · TRACKING</td></tr>
</table>
</body>
</html>
